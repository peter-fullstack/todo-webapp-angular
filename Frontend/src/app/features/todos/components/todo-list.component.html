<!-- features/todos/todo-list.component.html -->
<div class="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 font-sans antialiased">
  <div class="max-w-4xl mx-auto" *ngIf="userService.currentUser()">
    <!-- Header Block -->
    <div
      class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8 border-b border-slate-200 pb-5"
    >
      <div>
        <div>
          <h1 class="text-3xl font-bold text-slate-900 tracking-tight">My Tasks</h1>
          <p class="text-sm text-slate-500 mt-1">Manage, edit, and track your daily obligations.</p>
        </div>
        <div class="flex gap-2 mb-6">
          <a
            routerLink="/todos/add"
            class="bg-indigo-600 text-white px-4 py-2 rounded-md font-medium text-sm"
          >
            New To Do 
          </a>
          <button
            class="bg-indigo-600 text-white px-4 py-2 rounded-md font-medium text-sm"
            (click)="loadTodos()"
          >
            Get My Todos
         </button>
        </div>
      </div>
    </div>

    <!-- Loading Skeleton State -->
    <div *ngIf="isLoading()" class="space-y-3 animate-pulse">
      <div class="h-20 bg-slate-200 rounded-xl" *ngFor="let i of [1, 2, 3]"></div>
    </div>

    <div *ngIf="!isLoading() && todos().length === 0" class="space-y-3 animate-pulse">
        You currently have no tasks. Click "Add Todo" to create one.
    </div>

    <!-- Active Grid/List View -->
    <div *ngIf="!isLoading() && todos().length > 0" class="space-y-3">
      <div
        *ngFor="let todo of todos()"
        class="group relative flex items-start justify-between bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md hover:border-slate-300 transition-all"
        [ngClass]="{ 'bg-slate-50/50 border-slate-200': todo.isCompleted }"
      >
        <app-todo-item [todo]="todo"></app-todo-item>
      </div>
    </div>
  </div>
</div>
