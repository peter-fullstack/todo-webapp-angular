<!-- features/user/user-dropdown.component.html -->
<div class="w-full max-w-xs font-sans">
  <label for="user-select" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
    Active Session User
  </label>
  
  <div class="relative rounded-lg shadow-sm">
    <select
      id="user-select"
      [(ngModel)]="selectedUserId"
      (ngModelChange)="onUserChange($event)"
      class="block w-full appearance-none rounded-lg border border-slate-200 bg-white px-3.5 py-2 pr-10 text-sm font-medium text-slate-700 transition-all duration-200 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 hover:border-slate-300 cursor-pointer"
    >
      <option value="" disabled class="text-slate-400">-- Choose a User --</option>
      <option *ngFor="let user of users()" [value]="user.id" class="text-slate-900 font-normal">
        {{ user.name }} ({{ user.id }})
      </option>
    </select>
    
    <!-- Custom SVG Chevron Icon to replace default native browser arrow styling -->
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>
</div>
